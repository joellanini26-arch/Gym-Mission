<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Mission">
  <title>Gym Mission</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <div class="brand">Gym Mission</div>
      <div class="sub" id="levelLine"></div>
    </div>
    <div class="streak" id="streakBadge" title="Tage in Folge mit erreichtem Kalorienziel"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active"><span>☀️</span>Heute</button>
    <button data-tab="training"><span>🏋️</span>Training</button>
    <button data-tab="progress"><span>📈</span>Fortschritt</button>
    <button data-tab="settings"><span>⚙️</span>Setup</button>
  </nav>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
