<!doctype html>
<html lang="de">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

    <button data-tab="progress"><span>📈</span>Fortschritt</button>
    <button data-tab="settings"><span>⚙️</span>Setup</button>
  </nav>

  <div class="toast" id="toast"></div>
  <script src="fx.js"></script>
  <script src="holo.js"></script>
  <script src="food.js"></script>
  <script src="motivation.js"></script>
  <script src="stats.js"></script>
